<script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => { document.getElementById('mobile-menu').classList.toggle('hidden'); });

        // Gallery API Logic
        const API_KEY = 'YOUR_GOOGLE_API_KEY'; // You still need to replace this with a valid Google API Key
        const FOLDER_ID = '1tzJhSTVVYbh1J42kimYgGnLZmgd0P0BD'; // Updated with your Drive Folder ID
        
        const galleryContainer = document.getElementById('gallery-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const errorMessage = document.getElementById('error-message');
        const setupMessage = document.getElementById('setup-message');

        function createImageCard(imageUrl, altText) {
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-item relative aspect-square bg-gray-200 rounded-xl overflow-hidden shadow-md cursor-pointer group';
            
            const img = document.createElement('img');
            img.src = imageUrl;
            img.alt = altText || 'Gallery Image';
            img.className = 'gallery-img w-full h-full object-cover';
            img.loading = 'lazy';
            
            img.onload = () => img.classList.add('loaded');
            img.onerror = () => {
                img.src = 'https://placehold.co/400x400/e2e8f0/64748b?text=Image+Unavailable';
                img.classList.add('loaded');
            };

            wrapper.appendChild(img);
            return wrapper;
        }

        async function fetchDriveImages() {
            try {
                // Modified check to only look for the API key since the Folder ID is now set
                if (API_KEY === 'YOUR_GOOGLE_API_KEY') {
                    showPlaceholderGallery();
                    return;
                }
                const fetchUrl = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents&fields=files(id,name,mimeType)&key=${API_KEY}`;
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                const imageFiles = data.files.filter(file => file.mimeType.startsWith('image/'));

                if (imageFiles.length === 0) throw new Error('No images found.');

                loadingSpinner.classList.add('hidden');
                galleryContainer.classList.remove('hidden');

                imageFiles.forEach(file => {
                    const thumbnailUrl = `https://drive.google.com/thumbnail?id=${file.id}&sz=w800`;
                    const card = createImageCard(thumbnailUrl, file.name);
                    galleryContainer.appendChild(card);
                });
            } catch (error) {
                loadingSpinner.classList.add('hidden');
                errorMessage.classList.remove('hidden');
                if (error.message.includes('No images') || error.message.includes('API Error')) {
                    errorMessage.querySelector('p').textContent = `Unable to load gallery: ${error.message}`;
                }
            }
        }

        function showPlaceholderGallery() {
            setupMessage.classList.remove('hidden');
            loadingSpinner.classList.add('hidden');
            galleryContainer.classList.remove('hidden');

            for (let i = 1; i <= 8; i++) {
                const placeholderUrl = `https://picsum.photos/seed/elishaministry${i}/600/600`;
                const card = createImageCard(placeholderUrl, `Church Moment ${i}`);
                galleryContainer.appendChild(card);
            }
        }

        fetchDriveImages();
    </script>
